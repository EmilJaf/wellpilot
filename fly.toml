# Fly.io deployment. `fly launch --copy-config --no-deploy` once (it may rename the app),
# then set the secrets and `fly deploy`. See README, "Deploy".
app = "wellpilot"
primary_region = "iad"  # US East: near Baseten and the judges
kill_timeout = 10       # seconds after SIGTERM; the app saves runs in flight within 3

[build]

[env]
  LLM_PROVIDER = "baseten"
  PUBLIC = "true"
  TRUSTED_PROXY = "fly"

[http_service]
  internal_port = 8080
  force_https = true
  # Always one machine up: runs, budget and limits live in its memory, and a cold start
  # in front of a judge is the wrong first impression.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"  # SSE streams hold a connection for a whole run
    soft_limit = 150
    hard_limit = 200

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  memory = "1gb"  # DuckDB stores at 256 MB each, up to four cached
  cpu_kind = "shared"
  cpus = 1
