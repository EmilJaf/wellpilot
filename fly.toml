# Fly.io deployment. CI deploys every push to main that passes its checks (.github/workflows/
# ci.yml); by hand: `fly deploy`. Keys are Fly secrets. See README, "Deploy".
app = "wellpilot"
primary_region = "iad"  # US East: near Baseten and the judges
kill_timeout = 10       # seconds after SIGTERM; the app saves runs in flight within 3

[build]

[env]
  LLM_PROVIDER = "baseten"
  PUBLIC = "true"
  TRUSTED_PROXY = "fly"
  # The runs the public site lists and replays; each must be frozen in
  # backend/tests/fixtures/runs, the only runs the image holds (a test checks).
  FEATURED_RUNS = "69519dd0a995,dca494b07eb4,c6b4a6b047a8,c8501c918af6,485c17df2acb,f7d3faebb139"

[http_service]
  internal_port = 8080
  force_https = true
  # Always one machine up: runs, budget and limits live in its memory, and a cold start
  # in front of a judge is the wrong first impression.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"  # SSE streams hold a connection for a whole run
    soft_limit = 150
    hard_limit = 200

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  memory = "1gb"  # DuckDB stores at 256 MB each, up to four cached
  cpu_kind = "shared"
  cpus = 1
