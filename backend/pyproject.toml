[project]
name = "wellpilot"
version = "0.1.0"
description = "AI agent for oil and gas well performance analysis, running on Meta Muse Spark Open"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "openai>=3.38.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "pydantic-settings>=2.16.1",
    "pypdfium2>=5.14.0",
    "ruptures>=1.1.10",
    "scipy>=1.18.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "sse-starlette>=3.6.0",
    "tenacity>=9.2.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.2",
]
